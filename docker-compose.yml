services:
  db:
    image: postgres:16-alpine
    container_name: sunflower_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sunflower_secure_password_2026
      POSTGRES_DB: sunflower_garden
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sunflower_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:sunflower_secure_password_2026@db:5432/sunflower_garden
      AI_MODEL: gemini-1.5-flash
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.khuvuoncamxuc.app
    container_name: sunflower_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
