services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sunflower_backend
    restart: always
    environment:
      PORT: 8000
      DATABASE_URL: sqlite:///./garden.db
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sunflower_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
